<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f7a6c">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>每日精读 A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: a phone frame centered on a soft backdrop on desktop; full-bleed on phones. Tokens mirror the mini program's app.wxss. */
:root{
  --bg:#edf3f4; --surface:#ffffff; --soft:#e1edef; --ink:#0f2a33; --muted:#557079; --line:#cfdde0;
  --accent:#0b7a75; --amber:#b86e0c; --good:#1d8549; --bad:#bf3f2b; --goodbg:#e2f3e8; --badbg:#fbe9e5;
  --stage:#d6e2e4; --frame:#10232a;
  --font:-apple-system,"SF Pro Text","Helvetica Neue","PingFang SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#0b171c;--frame:#000}}
:root[data-theme="dark"]{--stage:#0b171c;--frame:#000}
*{box-sizing:border-box}
body{background:var(--stage);font-family:var(--font);color:var(--ink);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{font-size:13px;color:var(--muted);text-align:center;max-width:390px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cap{color:#8aa5ad}}
:root[data-theme="dark"] .cap{color:#8aa5ad}
.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 90px);min-height:560px;background:var(--frame);border-radius:46px;padding:12px;box-shadow:0 30px 60px rgba(10,30,36,.25)}
.screen{height:100%;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:34px;flex-shrink:0;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;padding:0 26px}
.nav{height:44px;flex-shrink:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600}
.nav .back{position:absolute;left:6px;top:0;bottom:0;background:none;border:0;color:#fff;font-size:26px;width:44px;cursor:pointer}
.nav .capsule{position:absolute;right:8px;top:8px;height:28px;width:80px;border:1px solid rgba(255,255,255,.45);border-radius:14px;display:flex;align-items:center;justify-content:space-around;font-size:14px}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (max-width:440px){body{padding:0}.phone{width:100%;height:100vh;max-height:none;border-radius:0;padding:0}.screen{border-radius:0}.cap{display:none}.stage{gap:0}}

/* mini-program styles (rpx ≈ px/2) */
.wrap{padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.h1{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.5px}.h1 .hl{color:var(--accent)}
.h2{font-size:19px;font-weight:700;line-height:1.25}
.h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}.meta{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;text-align:center}
.btn.dim{opacity:.4}
.ghost{border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;text-align:center;background:var(--surface)}
.tag{display:inline-block;font-weight:800;font-size:12px;background:var(--soft);color:var(--accent);border-radius:5px;padding:1px 7px;margin-right:6px}
.chip{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);font-weight:600}
.chip.good{background:var(--goodbg);color:var(--good)}.chip.bad{background:var(--badbg);color:var(--bad)}
.stars{color:var(--amber);letter-spacing:1px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar .fill{height:100%;background:var(--accent)}
.fact{border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;padding:8px 11px;font-size:14px}
.fb{border-radius:8px;padding:8px 11px;font-size:14px;font-weight:600}
.fb.ok{background:var(--goodbg);color:var(--good)}.fb.no{background:var(--badbg);color:var(--bad)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:11px 13px;font-size:15px;color:var(--ink)}
.opt.right{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:16px;height:44px;font-family:inherit;color:var(--ink);width:100%}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.name-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 14px}
.name-row input{flex:1;border:0;background:none;height:36px;font:inherit;font-size:15px;color:var(--ink);min-width:0}
.name-row input:focus{outline:none}
.big{font-size:32px;font-weight:800;color:var(--accent);line-height:1}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cell{height:18px;border-radius:4px;background:var(--line)}.cell.on{background:var(--accent)}.cell.part{background:#8cc7c2}.cell.today{box-shadow:0 0 0 1.5px var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list-h{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;color:var(--ink)}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--soft)}
.go{font-size:28px;color:var(--accent);line-height:1}
.later{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.later div{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:11px;color:var(--muted)}
.mod .no{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mod.done .no{background:var(--good);color:#fff}.mod.next .no{background:var(--accent);color:#fff}
.mod{justify-content:flex-start}.mod .txt{flex:1;min-width:0}
.card{align-items:center;text-align:center;padding:24px 16px}
.word{font-size:42px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.say{color:var(--accent);font-weight:600;font-size:14px;padding:3px 9px;border-radius:999px;background:var(--soft);border:0}
.syl{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.syl span{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:700;font-size:15px}
.syl span:nth-child(odd){color:var(--accent)}
.hit{color:var(--accent);font-weight:700}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec .r{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}
.rec .r.live{background:var(--bad)}
.rec .s{border:1px solid var(--line);color:var(--ink);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.chunk{font-size:14px;padding:6px 9px;background:var(--bg);border-radius:6px}
.center-node{background:var(--accent);color:#fff;border-radius:12px;padding:14px;text-align:center}
.center-node .meta{color:#d7f0ee}
.tree{display:flex;flex-direction:column;gap:10px;padding-left:14px;border-left:2px solid var(--line);margin-left:10px}
.branch{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px;position:relative}
.branch::before{content:"";position:absolute;left:-15px;top:22px;width:14px;height:2px;background:var(--line)}
.slot{border:1px dashed var(--line);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--muted);background:none;text-align:left;width:100%}
.slot.filled{border-style:solid;color:var(--ink);background:var(--bg)}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px #bfe3e0}
.slot.right{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.slot.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.slot.fixed{border-color:var(--amber);color:var(--amber)}
.pool{display:flex;flex-wrap:wrap;gap:7px}
.pchip{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:6px 11px;font-size:13px}
.pchip.used{opacity:.3}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.grid3 div{background:var(--soft);border-radius:8px;padding:8px 9px}
.grid3 b{display:block;font-size:17px;font-weight:800}
.tip{display:flex;gap:8px;align-items:baseline;font-size:14px}
.tip i{width:9px;height:9px;border-radius:50%;background:var(--amber);flex-shrink:0}
textarea.ta{width:100%;min-height:200px;font:inherit;font-size:15px;line-height:1.7;background:var(--bg);border:0;border-radius:8px;padding:10px;color:var(--ink)}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(15,42,51,.86);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:5;text-align:center;max-width:70%}

.stories{display:flex;flex-direction:column;gap:10px}
.story{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:14px;text-align:left;width:100%;color:var(--ink)}
.story:active{background:var(--soft)}
.sn{font-size:24px;font-weight:800;color:var(--tc);width:22px;flex-shrink:0}
.sbody{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.topic{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tc)}
.hero{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.panel-link{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.article p{margin:0;font-size:16px;line-height:1.75}
.pblock{display:flex;flex-direction:column;gap:6px}
.article.small p{font-size:14px}
.para{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:4px;border-radius:6px}
.para.hl{background:#fff5d6}
.pn{font-weight:800;color:var(--muted);font-size:12px;padding-top:3px}
.kp{display:grid;grid-template-columns:24px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
.kn{font-weight:800;color:var(--accent);font-size:16px}
.ol{display:inline-block;width:20px;color:var(--muted)}
.opt.right .ol,.opt.wrong .ol{color:inherit}
a{color:var(--accent)}
/* date strip */
.dstrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dchip{flex-shrink:0;width:62px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dwd{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.75}
.dnum{font-size:22px;font-weight:800;line-height:1.1}
.dmon{font-size:10.5px;opacity:.7}
.ddots{display:flex;gap:3px;margin-top:3px}.ddots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25}.ddots i.f{background:var(--good);opacity:1}
.dchip.on .ddots i.f{background:#7ee2a8}

.hlq{font-family:var(--serif);font-size:15px;line-height:1.65;background:var(--hlbg);border-left:3px solid var(--hl);border-radius:0 8px 8px 0;padding:9px 12px}
/* grammar */
.gmark{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;padding:0 2px}
.gex{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:15px;line-height:1.5;padding:6px 0;border-bottom:1px solid var(--line)}
.gex:last-child{border-bottom:0}
.gtab{display:grid;gap:4px;font-size:14px}.gtab>div{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
/* summary v2 */
.sumbox{border:2px solid var(--ink)}
.sslot{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink);min-height:44px}
.sslot.filled{border-style:solid;border-color:var(--accent);background:var(--soft);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sslot.filled{animation:none}}
.sslot .bul{color:var(--accent);font-weight:800}.sslot .x{margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
.sslot.right{border-color:var(--good);background:var(--goodbg);animation:none}.sslot.wrong{animation:none}.sslot.wrong{border-color:var(--bad);background:var(--badbg)}
.stmt2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:14px;line-height:1.45;color:var(--ink)}
.stmt2 .add{color:var(--accent);font-weight:800;font-size:18px;line-height:1}
.stmt2.done{flex-direction:column;gap:6px}
.stmt2.done.r{border-color:var(--good)}.stmt2.done.w{border-color:var(--bad);background:var(--badbg)}
.tchip{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.4px}
.tchip.good{background:var(--goodbg);color:var(--good)}.tchip.bad{background:var(--badbg);color:var(--bad)}.tchip.amber{background:#fdf0d5;color:var(--amber)}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0;white-space:nowrap}
.sheetp{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.7}
.sheetp mark{background:var(--hlbg);border-bottom:2px solid var(--hl);color:inherit}
textarea.ta.short{min-height:110px}
.model{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.model p{margin:0;font-family:var(--serif);font-size:16px;line-height:1.7}
.tw{color:var(--accent)}
.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;text-align:left;background:none;border:0;padding:4px 0;font-size:14px;color:var(--ink);width:100%}
.chk .cb{width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.chk.on .cb{background:var(--good);border-color:var(--good)}

/* explanations, test mode, review */
.panel>.fb{align-self:stretch;display:block}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;width:100%;color:var(--ink)}
.choice:active{border-color:var(--accent)}
.ow{display:flex;flex-direction:column;gap:6px}
.owi{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13px;line-height:1.45;color:var(--muted);padding:6px 8px;border-radius:8px;background:var(--bg)}
.owi b{color:var(--ink)}.owi.r{background:var(--goodbg);color:var(--good)}.owi.r b{color:var(--good)}.owi.w{background:var(--badbg);color:var(--bad)}.owi.w b{color:var(--bad)}
.evi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.evi p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.7}
.evi mark{background:var(--hlbg);border-bottom:2px solid var(--hl);color:inherit;padding:1px 0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.dot.done{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.dot.cur{box-shadow:0 0 0 2px var(--ink)}
.dot.ok{background:var(--goodbg);border-color:var(--good);color:var(--good)}.dot.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.chosen{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.you{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-left:6px;opacity:.8}

/* reader */
.screen{--serif:"Source Serif 4",Georgia,"Noto Serif","Songti SC",serif;--hl:#c98a00;--hlbg:#fff1bf;--kwbg:#cfeee9}
.reader{background:var(--surface);min-height:100%}
.rtools{position:sticky;top:0;z-index:4;display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tool{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.tool.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.sw-kw,.sw-ks{display:inline-block;width:10px;height:10px;border-radius:3px}
.sw-kw{background:var(--kwbg);border:1px solid #8fd3c9}.sw-ks{background:var(--hlbg);border:1px solid var(--hl)}
.rart{padding:20px 20px 4px}
.rkicker{color:var(--tc);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.rtitle{font-family:var(--serif);font-size:31px;line-height:1.1;margin:8px 0 10px;font-weight:700;letter-spacing:-.4px;text-wrap:balance}
.rdek{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 12px}
.rmeta{font-size:12px;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.rp{display:grid;grid-template-columns:16px 1fr;gap:8px;margin:0 -8px 18px;padding:4px 8px;border-radius:10px;transition:background .3s}
.rp.playing{background:#eaf6f4}
.rpn{font-size:11px;color:var(--muted);padding-top:7px;font-weight:700}
.rp p{margin:0;font-family:var(--serif);font-size:17.5px;line-height:1.78;color:var(--ink)}
.fs2 .rp p{font-size:19.5px}.fs3 .rp p{font-size:22px}
.lead::first-letter{float:left;font-size:3.3em;line-height:.85;padding:6px 7px 0 0;font-weight:700;color:var(--tc)}
.kw{all:unset;cursor:pointer;font-weight:600;background:linear-gradient(transparent 55%,var(--kwbg) 55%);border-radius:2px}
.kw:focus-visible{outline:2px solid var(--accent)}
.ks{cursor:pointer;background:var(--hlbg);border-bottom:2px solid var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 1px}
.ks .kw{background:linear-gradient(transparent 55%,#f5d67a 55%)}
.rsrc{font-size:12px;color:var(--muted);padding:12px 0 16px;border-top:1px solid var(--line)}
.kind{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--hl)}
.squote{font-family:var(--serif);font-size:17px;line-height:1.6;font-style:italic}
.sw{font-size:26px;font-weight:800;line-height:1.2}
.peek p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.7}
.center-txt{text-align:center;align-items:center}

/* colourful mind map */
.screen{--c0:#0f8b8d;--t0:#e3f4f4;--c1:#e8590c;--t1:#fff0e6;--c2:#4263eb;--t2:#e9edfd;--c3:#c2255c;--t3:#fbe7ef}
.mm{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:34px 10px;padding:4px 0;align-items:start}
.mm-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm-lines .ln{stroke-dasharray:6 6;opacity:.55}
.mm.done .mm-lines .ln{stroke-dasharray:600;stroke-dashoffset:600;opacity:1;animation:draw .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.mm.done .mm-lines .ln{animation:none;stroke-dashoffset:0}}
.mm-center{grid-column:1/-1;justify-self:center;width:78%;background:var(--ink);color:#fff;border-radius:22px;padding:14px 16px;text-align:center;position:relative;z-index:1;box-shadow:0 8px 20px rgba(15,42,51,.25)}
.mm-core{font-size:18px;font-weight:800;letter-spacing:-.3px}
.mm-q{font-size:12px;color:#b9d3d8;margin-top:3px}
.mmb{position:relative;z-index:1;background:var(--surface);border:2px solid var(--bc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mmb.tap{cursor:pointer}.mmb.tap:active{transform:scale(.98)}
.mmb-h{display:flex;align-items:center;gap:6px}
.mmb-n{width:22px;height:22px;border-radius:50%;background:var(--bc);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mmb-t{font-weight:800;font-size:14px;color:var(--bc);line-height:1.2}
.mmb-p{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.mslot{display:block;width:100%;text-align:left;font-size:12.5px;line-height:1.35;border:1.5px dashed var(--bc);border-radius:10px;padding:7px 8px;background:var(--surface);color:var(--muted);position:relative}
.mslot.filled{border-style:solid;background:var(--bt);color:var(--ink);font-weight:600}
.mslot.sel{box-shadow:0 0 0 3px var(--bt),0 0 0 4.5px var(--bc);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--bt),0 0 0 6.5px var(--bc)}}
@media (prefers-reduced-motion:reduce){.mslot.sel{animation:none}}
.mslot.right{border-color:var(--good);background:var(--goodbg)}
.mslot.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.mslot.fixed{border-color:var(--amber)}
.mk{font-style:normal;font-weight:800;margin-right:4px}
.mslot.right .mk{color:var(--good)}
.fixline{display:block;color:var(--good);font-weight:600;margin-top:3px}
.mmb-more{font-size:12px;font-weight:700;color:var(--bc)}
.pool{display:flex;flex-wrap:wrap;gap:7px}
.pchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;text-align:left;box-shadow:0 1px 0 var(--line)}
.pchip:active{transform:translateY(1px)}
.pchip.used{opacity:.25;box-shadow:none}
.sheet-bg{position:absolute;inset:0;background:rgba(15,42,51,.35);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-radius:22px 22px 0 0;border-top:5px solid var(--bc);padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.sfact{background:var(--bt);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55}

.headline{font-size:24px;text-wrap:balance}
.center-node{background:var(--accent);color:#fff;border-radius:12px;padding:14px;text-align:center}
.center-node .meta{color:#d7f0ee}
.tree{display:flex;flex-direction:column;gap:10px;padding-left:14px;border-left:2px solid var(--line);margin-left:10px}
.branch{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px;position:relative}
.branch.tap{cursor:pointer}
.branch::before{content:"";position:absolute;left:-15px;top:22px;width:14px;height:2px;background:var(--line)}
.slot{border:1px dashed var(--line);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--muted);background:none;text-align:left;width:100%}
.slot.filled{border-style:solid;color:var(--ink);background:var(--bg)}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px #bfe3e0}
.slot.right{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.slot.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.slot.fixed{border-color:var(--amber);color:var(--amber)}
.pool{display:flex;flex-wrap:wrap;gap:7px}
.kpbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.intro-s{font-weight:700;font-size:16px}
.slots3{display:flex;flex-direction:column;gap:6px}
.sslot{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-height:38px}
.sslot.filled{border-style:solid;background:var(--bg)}
.stmts{display:flex;flex-direction:column;gap:8px}
.stmt{display:grid;grid-template-columns:22px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink);width:100%}
.stmt .box{width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.stmt.on{border-color:var(--accent);background:var(--soft)}.stmt.on .box{background:var(--accent);border-color:var(--accent)}
.stmt.right{border-color:var(--good);background:var(--goodbg)}.stmt.right .box{border-color:var(--good)}
.stmt.wrong{border-color:var(--bad);background:var(--badbg)}.stmt.wrong .box{background:var(--bad);border-color:var(--bad)}
.stmt.dimmed{opacity:.6}
.stmt.right.picked .box{background:var(--good);border-color:var(--good)}
.why{display:block;font-size:12px;margin-top:4px;font-weight:600}.why.good{color:var(--good)}.why.bad{color:var(--bad)}
.chip.term{background:#efe7fb;color:#6741c7}
.word.long{font-size:30px}

/* web version: no fake phone chrome */
.status,.nav .capsule{display:none!important}
.nav{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>


<div class="stage">
  <div class="phone"><div class="screen">
    <div class="status"><span id="clock">9:41</span><span>●●● WiFi 98%</span></div>
    <div class="nav"><button class="back" id="backBtn" aria-label="Back" hidden>‹</button><span id="navTitle">Daily Reading · A2</span><span class="capsule">··· ◉</span></div>
    <div class="body" id="body"></div>
    <div class="toast" id="toast" hidden></div>
  </div></div>
  <p class="cap">Daily Reading · A2 English practice. Progress is kept in this browser; recording is simulated.</p>
</div>

<script>
/* content is loaded at runtime from days/*.json */
</script>
<script>
/* Daily News preview — mirrors the mini program logic. Content is loaded from days/index.json and days/<date>.json. */
let DAYS = [], AUDIO = {}, selDate = null;
try { selDate = sessionStorage.getItem('news-ket-day'); } catch (e) {}
const KEY = 'news-ket-v1';
let P = { name: '', arts: {}, srs: {}, days: {}, rec: {}, writing: {} };
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const dayLabel = s => `${MON[+s.slice(5, 7) - 1]} ${+s.slice(8)}`;
const longDay = s => { const [y, m, d] = s.split('-').map(Number); return `${WD[new Date(y, m - 1, d).getDay()]}, ${MON[m - 1]} ${d}`; };
const nowLabel = () => { const d = new Date(); return `${MON[d.getMonth()]} ${d.getDate()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const allArts = () => DAYS.flatMap(d => d.articles.map(a => Object.assign(a, { date: d.date })));
const art = id => allArts().find(a => a.id === id);
const arec = id => P.arts[id] || (P.arts[id] = { done: {} });
const markDone = (id, mod, extra) => { const r = arec(id); r.done[mod] = true; if (extra) Object.assign(r, extra); save(); };
const INTERVAL = [0, 1, 2, 4, 7, 15], CAP = 15;
const itemsOf = a => a.kps.map(k => ({ id: k.id, kind: 'kp', art: a.id, k })).concat(a.words.map(w => ({ id: `${a.id}-w-${w.w}`, kind: 'word', art: a.id, w })), ((a.grammar || {}).items || []).map((g, i) => ({ id: `${a.id}-g${i}`, kind: 'gr', art: a.id, g, a })));
const itemById = id => { for (const a of allArts()) { const it = itemsOf(a).find(x => x.id === id); if (it) return it; } return null; };
function enroll(a, wrongIds) {
  const t = today();
  itemsOf(a).forEach(it => {
    const wrong = wrongIds.includes(it.id);
    if (!P.srs[it.id]) P.srs[it.id] = { box: wrong ? 1 : 2, due: addDays(t, wrong ? 1 : 2), n: 0 };
    else if (wrong) { P.srs[it.id].box = 1; P.srs[it.id].due = addDays(t, 1); }
  });
  save();
}
const dueIds = () => Object.keys(P.srs).filter(id => P.srs[id].due <= today() && itemById(id)).sort((a, b) => P.srs[a].box - P.srs[b].box);
function grade(id, ok, counted) {
  const t = today(); const d = P.days[t] || (P.days[t] = { done: 0, correct: 0, checked: false });
  d.done++; if (ok) d.correct++;
  const s = P.srs[id];
  if (s && counted) { s.n++; if (ok) { s.box = Math.min(5, s.box + 1); s.due = addDays(t, INTERVAL[s.box]); } else { s.box = 1; s.due = addDays(t, 1); } }
  save();
}
const checkIn = () => { const t = today(); (P.days[t] || (P.days[t] = { done: 0, correct: 0 })).checked = true; save(); };
function streak() { let d = today(), n = 0; if (!(P.days[d] && P.days[d].checked)) d = addDays(d, -1); while (P.days[d] && P.days[d].checked) { n++; d = addDays(d, -1); } return n; }
function calendar() { const t = today(); let h = ''; for (let i = 27; i >= 0; i--) { const d = addDays(t, -i), r = P.days[d]; h += `<div class="cell ${r && r.checked ? 'on' : r && r.done ? 'part' : ''} ${i === 0 ? 'today' : ''}"></div>`; } return `<div class="cal">${h}</div>`; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsOf = p => p >= 90 ? 5 : p >= 75 ? 4 : p >= 60 ? 3 : p >= 40 ? 2 : 1;
const starStr = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1600); }
const player = new Audio();
let queue = [];
let qIdx = -1;
player.onended = () => { if (queue.length) { qIdx++; player.src = queue.shift(); player.play().catch(() => {}); hlPara(); } else markPlaying(false); };
function hlPara() { document.querySelectorAll('.rp').forEach(el => el.classList.toggle('playing', +el.dataset.p === qIdx)); const el = document.querySelector('.rp.playing'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function markPlaying(on) { const b = document.querySelector('[data-act=playall]'); if (b) b.textContent = on ? '❚❚ Stop' : '▶ Listen'; if (!on) { qIdx = -1; hlPara(); } }
function speak(text) {
  stopSpeak();
  const src = AUDIO[text];
  if (src) { player.src = src; player.play().catch(() => toast('Tap again to play')); return; }
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .92; speechSynthesis.speak(u); } catch (e) { toast('No audio available'); }
}
function playAll(texts) { stopSpeak(); queue = texts.map(t => AUDIO[t]).filter(Boolean); if (!queue.length) return; qIdx = 0; player.src = queue.shift(); player.play().catch(() => {}); markPlaying(true); hlPara(); }
function stopSpeak() { queue = []; try { player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} markPlaying(false); }
function inArticle(a, w) {
  const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(s|es)?\\b', 'i');
  for (const p of a.paras) { const sents = p.match(/[^.!?]+[.!?]+["”]?/g) || [p]; const hit = sents.find(x => re.test(x)); if (hit) return { html: esc(hit.trim()).replace(re, m => `<span class="hit">${m}</span>`), para: a.paras.indexOf(p) + 1 }; }
  return null;
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch (e) { toast('Copy works in WeChat'); } }
const wc = t => (t.trim().match(/[A-Za-z’']+/g) || []).length;

/* ---------- router ---------- */
const stack = [];
const TITLE = { home: 'Daily Reading · A2', article: '', words: 'Words', quiz: 'Quiz', summary: 'Summary', grammar: 'Grammar', mindmap: 'Mind map', read: '', speak: 'Speak', write: 'Write', result: 'Results', archive: 'Past days' };
function go(page, params = {}) { stopSpeak(); const st = { page, params, s: {} }; stack.push(st); if (PAGES[page].init) PAGES[page].init(st); render(true); }
function back() { stopSpeak(); if (stack.length > 1) { stack.pop(); render(true); } }
function redirect(page, params) { stack.pop(); go(page, params); }
const cur = () => stack[stack.length - 1];
function render(top) {
  const st = cur();
  $('#navTitle').textContent = st.title || TITLE[st.page];
  $('#backBtn').hidden = stack.length < 2;
  $('#body').innerHTML = PAGES[st.page].view(st);
  if (top) $('#body').scrollTop = 0;
  if (PAGES[st.page].after) PAGES[st.page].after(st);
  const f = $('#body [data-autofocus]'); if (f) f.focus();
}
$('#backBtn').onclick = back;
(function tick() { const d = new Date(); $('#clock').textContent = `${d.getHours()}:${pad(d.getMinutes())}`; setTimeout(tick, 30000); })();

let recLive = null;
function recorder(key) {
  const r = P.rec[key], live = recLive && recLive.key === key;
  return `<div class="rec"><button class="r ${live ? 'live' : ''}" data-act="rec" data-key="${key}">${live ? '■ Stop' : r ? '● Record again' : '● Record'}</button>
    ${r && !live ? `<button class="s" data-act="recplay">▶ Play · ${r.sec}s</button><button class="s" data-act="recshare">Send to teacher</button>` : ''}</div>`;
}

/* ---------- questions ---------- */
const blankOut = (ex, w) => ex.replace(new RegExp('\\b' + w + '\\b', 'i'), '______');
const kpQ = k => ({ id: k.id, type: 'mc', tag: k.tag, prompt: k.q, opts: k.opts, a: k.a, fact: k.fact });
function wordQ(aid, w, pool, spell) {
  const id = `${aid}-w-${w.w}`;
  if (spell && !/\s/.test(w.w)) return { id, type: 'spell', tag: 'Word', prompt: 'Spell the word:', def: `${w.def} (${w.pos})`, sub: blankOut(w.ex, w.w), answer: w.w };
  const opts = shuffle([w.w].concat(shuffle(pool.filter(x => x.w !== w.w)).slice(0, 3).map(x => x.w)));
  return { id, type: 'mc', tag: 'Word', prompt: 'Choose the word that fills the blank:', sub: blankOut(w.ex, w.w), opts, a: opts.indexOf(w.w), fact: `${w.w} ${w.ipa} — ${w.def}` };
}
const gramQ = (a, g, i) => g.type === 'fill'
  ? { id: `${a.id}-g${i}`, type: 'spell', tag: 'Grammar', prompt: 'Write the missing word(s):', def: g.hint, sub: g.q, answer: g.a, fact: g.why, ph: 'Type the answer' }
  : { id: `${a.id}-g${i}`, type: 'mc', tag: 'Grammar', prompt: g.q, opts: g.opts, a: g.a, fact: g.why };
const itemQ = it => it.kind === 'gr' ? gramQ(it.a, it.g, +it.id.split('-g').pop()) : it.kind === 'kp' ? kpQ(it.k) : (() => { const a = art(it.art), s = P.srs[it.id]; return wordQ(a.id, it.w, a.words, (s && s.box >= 3) || Math.random() < .4); })();
const QT = { toefl: 'Questions', grammar: 'Grammar', review: 'Daily review' };

const MODS = [
  ['words', 'Words', '8–10 words · A2 + topic words'],
  ['read', 'Read', 'Highlighted words & key sentences · listen'],
  ['toefl', 'Questions', '6 A2 reading questions'],
  ['grammar', 'Grammar', 'One grammar point · 6 practice items'],
  ['mindmap', 'Mind map', 'Build the story map · key points'],
  ['summary', 'Summary', 'Main ideas · pick 3 of 6'],
  ['speak', 'Speak', 'Answer a question · record'],
  ['write', 'Write', 'Write a short message'],
  ['results', 'Results', 'See where the gaps are']
];
const TOPIC = { Economy: '#b35c00', Nature: '#2f9e44', Animals: '#5c940d', Geography: '#1971c2', Space: '#3b5bdb', Environment: '#2b8a3e', Health: '#c2410c', Technology: '#7048e8', Society: '#0b7285', Culture: '#a61e4d', Science: '#0b7a75' };

function passage(a, hlPara) {
  return a.paras.map((p, i) => `<p class="para ${hlPara === i + 1 ? 'hl' : ''}"><span class="pn">${i + 1}</span><span>${esc(p)}</span></p>`).join('');
}

/* ---------- pages ---------- */
const PAGES = {
  home: {
    view() {
      const t = today(), due = dueIds().length, enrolled = Object.keys(P.srs).length, rec = P.days[t], checked = rec && rec.checked;
      const latest = DAYS.find(d => d.date === selDate) || DAYS[0];
      const strip = DAYS.length > 1 ? `<div class="dstrip" role="tablist" aria-label="Choose a day">${DAYS.map(d => {
        const [y, m, dd] = d.date.split('-').map(Number), wd = WD[new Date(y, m - 1, dd).getDay()].slice(0, 3);
        const done = d.articles.filter(a => P.arts[a.id] && P.arts[a.id].overall != null).length;
        return `<button class="dchip ${d.date === latest.date ? 'on' : ''}" role="tab" aria-selected="${d.date === latest.date}" data-act="pickday" data-d="${d.date}"><span class="dwd">${d.date === t ? 'Today' : wd}</span><span class="dnum num">${dd}</span><span class="dmon">${MON[m - 1]}</span><span class="ddots">${d.articles.map((a, i) => `<i class="${i < done ? 'f' : ''}"></i>`).join('')}</span></button>`; }).join('')}</div>` : '';
      return `<div class="wrap">
        ${strip}
        <div><div class="eyebrow">${longDay(latest.date)}${latest.date === t ? ' · Today' : ''}</div><div class="h1 headline">${esc(latest.headline || 'Today in the news')}</div>
          ${latest.teaser ? `<div class="meta">${esc(latest.teaser)}</div>` : ''}</div>
        <label class="name-row"><span class="muted">Name</span><input id="nameIn" value="${esc(P.name)}" placeholder="Your name, for your teacher"></label>
        <div class="stories">${latest.articles.map((a, i) => artCard(a, i)).join('')}</div>
        <div class="panel">
          <div><div class="eyebrow">Daily review · ${dayLabel(t)}</div><div class="h2">${!enrolled ? 'Starts after your first story' : checked ? 'Checked in today' : 'Not checked in yet'}</div></div>
          ${!enrolled ? `<div class="meta">Finish Questions and Summary, and the story's key points and words join your daily review. Right answers come back after a few days; wrong ones come back tomorrow.</div>`
            : `<div class="spread"><div><span class="big num">${streak()}</span> <span class="muted">day streak</span></div><span class="meta num">Due ${due} · Learned ${enrolled}${rec && rec.done ? ` · Today ${rec.correct}/${rec.done}` : ''}</span></div>`}
          ${calendar()}<div class="spread meta"><span>4 weeks ago</span><span>Today</span></div>
          ${!enrolled ? '' : !checked && due ? `<button class="btn" data-act="review">Start review · ${Math.min(due, CAP)} questions</button>`
            : !checked ? `<button class="btn" data-act="checkin">Nothing due today — check in</button>`
            : due ? `<button class="ghost" data-act="review">Keep going · ${Math.min(due, CAP)} more</button>` : `<button class="ghost" data-act="review" data-extra="1">Practice 10 more</button>`}
          ${enrolled ? `<button class="ghost" data-act="demoDue">Preview only: make all items due now</button>` : ''}
        </div>
        <div class="meta">Progress, check-ins, and recordings are saved on this phone only.</div>
        <button class="ghost" data-act="reset">Preview only: reset all progress</button>
      </div>`;
    }
  },
  archive: {
    view() {
      return `<div class="wrap">${DAYS.map(d => `<div><div class="eyebrow">${longDay(d.date)}</div>${d.headline ? `<div class="h3">${esc(d.headline)}</div>` : ''}</div><div class="stories">${d.articles.map((a, i) => artCard(a, i)).join('')}</div>`).join('')}</div>`;
    }
  },

  article: {
    init(st) { st.title = art(st.params.id).topic; },
    view(st) {
      const a = art(st.params.id), r = arec(a.id);
      const mods = MODS.map((m, i) => ({ key: m[0], no: i + 1, title: m[1], sub: m[2], done: m[0] === 'results' ? r.overall != null : !!r.done[m[0]] }));
      const n = mods.filter(m => m.done).length, next = mods.find(m => !m.done);
      return `<div class="wrap">
        <div class="hero" style="--tc:${TOPIC[a.topic] || 'var(--accent)'}"><span class="topic">${esc(a.topic)}</span><div class="h2">${esc(a.title)}</div>
          <div class="meta">${longDay(a.date)} · ${a.paras.join(' ').split(/\s+/).length} words · ~${Math.round(a.paras.join(' ').split(/\s+/).length / 180)} min read</div>
          <div class="bar"><div class="fill" style="width:${n / mods.length * 100}%"></div></div><span class="meta num">${n}/${mods.length} steps done</span></div>
        <div class="list">${mods.map(m => `<button class="item mod ${m.done ? 'done' : ''} ${next && m.key === next.key ? 'next' : ''}" data-act="mod" data-key="${m.key}">
          <span class="no num">${m.done ? '✓' : m.no}</span><span class="txt"><div class="h3">${m.title}</div><div class="meta">${m.sub}</div></span>
          ${next && m.key === next.key ? '<span class="chip">Next</span>' : ''}<span class="go" style="color:var(--muted)">›</span></button>`).join('')}</div>
        <div class="meta">${a.genre ? esc(a.genre) + ' · ' : ''}${a.sources && a.sources.length ? `Facts from ${a.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(', ')} · ` : ''}Written for A2 learners.</div>
      </div>`;

  },

    view(st) {
      const a = art(st.params.id), i = st.s.i, w = a.words[i], n = a.words.length;

        <div class="spread"><span class="eyebrow">Step 1 · Words</span><span class="meta num">${i + 1} / ${n}</span></div>
        <div class="bar"><div class="fill" style="width:${(i + 1) / n * 100}%"></div></div>
        <div class="panel card"><span class="chip ${w.level === 'Topic word' ? 'term' : ''}">${esc(w.level || '')}</span><div class="word ${w.w.length > 12 ? 'long' : ''}">${esc(w.w)}</div>
          <div class="row" style="justify-content:center"><span class="muted" style="font-size:16px">${esc(w.ipa)}</span><button class="say" data-act="speak" data-t="${esc(w.w)}">🔊 Listen</button></div>
          <div class="syl">${w.syl.map(x => `<span>${esc(x)}</span>`).join('')}</div><div class="meta">${esc(w.pos)}</div>
          ${st.s.show ? `<div style="font-size:17px;font-weight:700">${esc(w.def)}</div>` : `<button class="ghost" data-act="reveal">Guess the meaning, then tap to check</button>`}</div>
        ${(() => { const hit = inArticle(a, w.w); return hit ? `<div class="panel"><span class="eyebrow">In the article · paragraph ${hit.para}</span><div style="font-size:15px;line-height:1.7">${hit.html}</div></div>` : ''; })()}
        <div class="panel"><div class="spread"><span class="eyebrow">Another example</span><button class="say" data-act="speak" data-t="${esc(w.ex)}">🔊</button></div><div style="font-size:16px;line-height:1.7">${ex}</div></div>
        <div class="row" style="flex-wrap:nowrap"><button class="ghost" style="flex:1;${i === 0 ? 'opacity:.4' : ''}" data-act="wprev">Previous</button><button class="btn" style="flex:1" data-act="wnext">${i === n - 1 ? 'Done' : 'Next word'}</button></div>
      </div>`;
    }
  },

  read: {
    init(st) { st.title = 'Read'; st.s.t0 = Date.now(); st.s.sheet = null; },
    view(st) {
      const a = art(st.params.id), s = st.s, hl = Object.assign({ w: true, s: true }, P.hl), fs = P.fs || 1;
      const words = a.paras.join(' ').split(/\s+/).length;
      const reW = new RegExp('\\b(' + a.words.map(w => w.w.replace(/[-]/g, '\\-')).sort((x, y) => y.length - x.length).join('|') + ')(s|es)?\\b', 'gi');
      const markWords = t => hl.w ? t.replace(reW, m => { const base = a.words.find(w => m.toLowerCase().startsWith(w.w.toLowerCase())); return `<button class="kw" data-act="kw" data-w="${esc(base ? base.w : m)}">${m}</button>`; }) : t;
      const paraHtml = (p, pi) => {
        const ks = (a.keySentences || []).map((k, i) => ({ ...k, i })).filter(k => k.para === pi + 1);
        let segs = [{ t: p }];
        if (hl.s) ks.forEach(k => { segs = segs.flatMap(sg => { if (sg.k != null || !sg.t.includes(k.text)) return [sg]; const [x, ...y] = sg.t.split(k.text); return [{ t: x }, { t: k.text, k: k.i }, { t: y.join(k.text) }]; }); });
        return segs.map(sg => sg.k != null ? `<span class="ks" data-act="ks" data-i="${sg.k}">${markWords(esc(sg.t))}</span>` : markWords(esc(sg.t))).join('');
      };
      let sheet = '';
      if (s.sheet && s.sheet.kind === 'w') { const w = a.words.find(x => x.w === s.sheet.w) || {};
        sheet = `<div class="sheet-bg" data-act="rclose"></div><div class="sheet" style="--bc:var(--accent);--bt:var(--soft)"><div class="grab"></div>
          <div class="spread"><span class="chip ${w.level === 'Topic word' ? 'term' : ''}">${esc(w.level || '')}</span><button class="say" data-act="speak" data-t="${esc(w.w)}">🔊</button></div>
          <div class="sw">${esc(w.w)} <span class="muted" style="font-size:15px;font-weight:400">${esc(w.ipa || '')} · ${esc(w.pos || '')}</span></div>
          <div class="sfact">${esc(w.def || '')}</div><div class="meta">${esc(w.ex || '')}</div><button class="ghost" data-act="rclose">Back to the article</button></div>`; }
      if (s.sheet && s.sheet.kind === 's') { const k = a.keySentences[s.sheet.i];
        sheet = `<div class="sheet-bg" data-act="rclose"></div><div class="sheet" style="--bc:var(--hl);--bt:var(--hlbg)"><div class="grab"></div>
          <div class="spread"><span class="kind">${esc(k.kind)}</span><span class="chip">Paragraph ${k.para}</span></div>
          <div class="squote">“${esc(k.text)}”</div><div class="sfact">${esc(k.note)}</div>
          <div class="row"><button class="say" data-act="speak" data-t="${esc(k.text)}">🔊 Listen</button><button class="ghost" data-act="rclose">Back to the article</button></div></div>`; }
      const done = s.result;
      return `<div class="reader fs${fs}">
        <div class="rtools"><button class="tool" data-act="playall">▶ Listen</button><button class="tool ${hl.w ? 'on' : ''}" data-act="rhl" data-k="w"><i class="sw-kw"></i>Words</button><button class="tool ${hl.s ? 'on' : ''}" data-act="rhl" data-k="s"><i class="sw-ks"></i>Key sentences</button><button class="tool" data-act="rsize" aria-label="Text size">Aa</button></div>
        <article class="rart" style="--tc:${TOPIC[a.topic] || 'var(--accent)'}">
          <div class="rkicker">${esc(a.topic)} · ${longDay(a.date)}</div>
          <h1 class="rtitle">${esc(a.title)}</h1>
          ${a.dek ? `<p class="rdek">${esc(a.dek)}</p>` : ''}
          <div class="rmeta">${words} words · about ${Math.max(2, Math.round(words / 150))} min · tap highlights to learn more</div>
          ${a.paras.map((p, i) => `<div class="rp" data-p="${i}"><span class="rpn">${i + 1}</span><p class="${i === 0 ? 'lead' : ''}">${paraHtml(p, i)}</p></div>`).join('')}
          <div class="rsrc">${a.genre ? esc(a.genre) + ' · ' : ''}${a.sources && a.sources.length ? `Facts from ${a.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(', ')} · ` : ''}Written for A2 learners.</div>
        </article>
        <div class="wrap" style="padding-top:0">${done
          ? `<div class="panel center-txt"><span class="eyebrow">Reading done</span><div class="row" style="justify-content:center;gap:24px"><div><span class="big num">${Math.floor(done.secs / 60)}:${pad(done.secs % 60)}</span><div class="meta">time</div></div><div><span class="big num">${done.wpm}</span><div class="meta">words / min</div></div></div><div class="meta">${done.wpm < 60 ? 'Take your time. Try to read a little faster next time.' : done.wpm > 180 ? 'Very fast. Make sure you can still answer the questions!' : 'Good reading pace.'}</div><button class="btn" data-act="toquiz">Go to the questions</button></div>`
          : `<button class="btn" data-act="rdone">I've finished reading</button>`}</div>
      </div>${sheet}`;
    }
  },

  quiz: {
    init(st) {
      const { mode, id, extra } = st.params; st.title = extra ? 'Extra practice' : QT[mode];
      let qs = [];
      if (mode === 'review') {
        let ids = dueIds().slice(0, CAP);
        if (extra || !ids.length) ids = shuffle(Object.keys(P.srs).filter(itemById)).sort((x, y) => P.srs[x].box - P.srs[y].box).slice(0, 10);
        qs = shuffle(ids).map(x => itemQ(itemById(x)));
      } else {
        const a = art(id);
        if (mode === 'grammar') qs = a.grammar.items.map((g, i) => gramQ(a, g, i));
        if (mode === 'toefl') qs = a.questions.map((q, i) => ({ id: `${a.id}-q${i}`, type: 'mc', tag: q.type, prompt: q.q, opts: q.opts, a: q.a, fact: q.why, para: q.para, evidence: q.evidence, optWhy: q.optWhy, highlight: q.highlight }));
      }
      Object.assign(st.s, { qs, i: 0, answered: false, picked: -1, typed: '', ok: false, correct: 0, wrong: [], requeued: {}, finished: false, showP: false, style: mode === 'toefl' ? null : 'practice', answers: [], reviewing: false, ri: 0, t0: 0 });
    },
    view(st) {
      const s = st.s, { mode, extra, id } = st.params;
      if (!s.qs.length) return `<div class="wrap"><div class="panel">Nothing to review.</div></div>`;
      if (mode === 'toefl' && !s.style) return `<div class="wrap">
        <div><div class="eyebrow">Questions · ${esc(art(id).title)}</div><div class="h2">How do you want to practice?</div></div>
        <button class="choice" data-act="style" data-v="practice"><span class="h3">Practice mode</span><span class="meta">See the answer and a full explanation after each question.</span></button>
        <button class="choice" data-act="style" data-v="test"><span class="h3">Test mode <span class="chip">Exam-like</span></span><span class="meta">No feedback until the end. You can change answers and move between questions. Timed.</span></button>
      </div>`;
      if (s.reviewing) return reviewView(st);
      if (s.finished) return quizDone(st);
      const q = s.qs[s.i], n = s.qs.length;
      if (s.style === 'test') return testView(st);
      const a0 = mode === 'toefl' ? art(id) : null;
      const pasg = a0 && !s.answered ? (q.para ? `<button class="ghost" data-act="togglep">${s.showP ? 'Hide' : 'Check'} paragraph ${q.para}</button>${s.showP ? `<div class="panel peek"><span class="eyebrow">Paragraph ${q.para}</span><p>${esc(a0.paras[q.para - 1])}</p></div>` : ''}` : `<button class="ghost" data-act="toread">Reread the article</button>`) : '';

      return `<div class="wrap"><div class="panel">
        <div class="spread"><span class="eyebrow">${extra ? 'Extra practice · does not affect check-in' : QT[mode]}</span><span class="meta num">${s.i + 1} / ${n} · ${s.correct} correct</span></div>
        <div class="bar"><div class="fill" style="width:${(s.i + (s.answered ? 1 : 0)) / n * 100}%"></div></div>
        <div><span class="chip">${esc(q.tag)}</span></div>
        <div style="font-size:17px;font-weight:600">${esc(q.prompt)}</div>
        ${q.highlight ? `<div class="hlq">${esc(q.highlight)}</div>` : ''}
        ${q.type === 'spell' ? `<div style="font-size:16px;font-weight:700;color:var(--accent)">${esc(q.def)}</div>` : ''}
        ${q.sub ? `<div class="muted">${esc(q.sub)}</div>` : ''}
        ${q.type === 'mc' ? `<div style="display:flex;flex-direction:column;gap:8px">${q.opts.map((o, i) => `<button class="opt ${s.answered && i === q.a ? 'right' : ''} ${s.answered && i === s.picked && i !== q.a ? 'wrong' : ''}" data-act="pick" data-i="${i}" ${s.answered ? 'disabled' : ''}><b class="ol">${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>`
          : `<form class="row" data-act="spell" style="flex-wrap:nowrap"><input class="input" id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(s.typed)}" ${s.answered ? 'disabled' : 'data-autofocus'} placeholder="${q.ph || 'Type the word'}"><button class="btn ${s.answered ? 'dim' : ''}" ${s.answered ? 'disabled' : ''}>Check</button></form>`}
        ${s.answered ? (q.type === 'spell'
            ? `<div class="fb ${s.ok ? 'ok' : 'no'}">${s.ok ? 'Correct' : 'Answer: ' + esc(q.answer)} <button class="say" data-act="speak" data-t="${esc(q.answer)}">🔊</button></div>${q.tag === 'Grammar' && q.fact ? `<div class="fact">${esc(q.fact)}</div>` : ''}`
            : `<div class="fb ${s.ok ? 'ok' : 'no'}">${s.ok ? 'Correct' : 'Not quite.'}</div>${q.optWhy ? explain(q, s.picked, a0) : `<div class="fact">${esc(q.fact)}</div>`}`)
          + `<button class="btn" data-act="next" data-autofocus>${s.i === n - 1 ? 'Finish' : 'Next'}</button>` : ''}
      </div>${pasg}</div>`;
    }
  },

  mindmap: {
    init(st) {
      const a = art(st.params.id), mm = a.mindmap; let k = 0; const ans = [];
      st.s.branches = mm.branches.map((b, bi) => ({ bi, title: b.title, paras: b.paras, kps: b.kps, slots: b.blanks.map(t => { ans.push(t); return { k: k++, answer: t, fill: '', state: '' }; }) }));
      st.s.pool = shuffle(ans.concat(mm.distractors)).map((t, i) => ({ i, t, used: false, decoy: mm.distractors.includes(t) }));
      st.s.sel = 0; st.s.checked = false; st.s.sheet = -1;
    },
    view(st) {
      const a = art(st.params.id), mm = a.mindmap, s = st.s;
      const branch = b => `<div class="mmb b${b.bi} ${s.checked ? 'tap' : ''}" data-b="${b.bi}" ${s.checked ? `data-act="mmopen"` : ''} style="--bc:var(--c${b.bi});--bt:var(--t${b.bi})">
          <div class="mmb-h"><span class="mmb-n">${b.bi + 1}</span><span class="mmb-t">${esc(b.title)}</span></div>
          <div class="mmb-p">Para ${b.paras}</div>
          ${b.slots.map(x => `<button class="mslot ${s.sel === x.k ? 'sel' : ''} ${x.fill ? 'filled' : ''} ${x.state}" data-act="slot" data-k="${x.k}" ${s.checked ? 'tabindex="-1"' : ''}>${x.state === 'right' ? '<i class="mk">✓</i>' : x.state === 'wrong' ? '<i class="mk">✗</i>' : ''}${esc(x.fill || 'tap to fill')}${x.state === 'wrong' ? `<span class="fixline">→ ${esc(x.answer)}</span>` : ''}</button>`).join('')}
          ${s.checked ? '<div class="mmb-more">Key point ›</div>' : ''}
        </div>`;
      const sheet = s.sheet >= 0 ? (() => { const b = s.branches[s.sheet], src = a.mindmap.branches[s.sheet];
        const facts = b.kps.length ? b.kps.map(id => (a.kps.find(k => k.id === id) || {}).fact).filter(Boolean) : src.blanks;
        const pn = parseInt(b.paras);
        return `<div class="sheet-bg" data-act="mmclose"></div><div class="sheet" style="--bc:var(--c${b.bi});--bt:var(--t${b.bi})"><div class="grab"></div>
          <div class="spread"><span class="mmb-h"><span class="mmb-n">${b.bi + 1}</span><span class="h3">${esc(b.title)}</span></span><span class="chip">Para ${b.paras}</span></div>
          ${facts.map(f => `<div class="sfact">${esc(f)}</div>`).join('')}
          <div class="row"><button class="say" data-act="speak" data-t="${esc(a.paras[pn - 1])}">🔊 Listen to paragraph ${pn}</button><button class="ghost" data-act="mmclose">Close</button></div></div>`; })() : '';
      return `<div class="wrap">
        <div><div class="eyebrow">Step 5 · Mind map</div><div class="h2">Map the article</div><div class="meta">Tap an empty box, then tap the phrase that belongs there. Watch out: two phrases are traps.</div></div>
        <div class="mm ${s.checked ? 'done' : ''}" id="mm">
          <svg class="mm-lines" id="mmLines" aria-hidden="true"></svg>
          ${branch(s.branches[0])}${branch(s.branches[1])}
          <div class="mm-center"><div class="mm-core">${esc(mm.center)}</div><div class="mm-q">${esc(mm.question)}</div></div>
          ${branch(s.branches[2])}${branch(s.branches[3])}
        </div>
        ${!s.checked ? `<div class="panel"><div class="spread"><span class="eyebrow">Phrase bank</span><span class="meta num">${s.pool.filter(p => !p.used).length} left</span></div><div class="pool">${s.pool.map(p => `<button class="pchip ${p.used ? 'used' : ''}" data-act="chip" data-i="${p.i}">${esc(p.t)}</button>`).join('')}</div>
          <button class="btn" data-act="mmcheck">Check my map</button></div>`
          : `<div class="panel"><div class="spread"><span class="h3">Score</span><span class="h2 num">${s.score}</span></div><div class="meta">Traps: ${s.pool.filter(p => p.decoy).map(p => '“' + esc(p.t) + '”').join(' and ')}. Tap any branch to see its key point.</div>
          <div class="row"><button class="ghost" data-act="mmshow">Show answers</button><button class="ghost" data-act="mmretry">Try again</button><button class="btn" data-act="back">Done</button></div></div>`}
      </div>${sheet}`;
    },
    after() { drawLines(); }
  },

  summary: {
    init(st) { const a = art(st.params.id); st.s.order = shuffle(a.summary.options.map((o, i) => i)); st.s.sel = []; st.s.checked = false; st.s.sheet = -1; st.s.stage = 1; st.s.own = (P.writing[a.id + '-sum'] || {}).text || ''; st.s.compared = false; st.s.checks = {}; },
    view(st) {
      const a = art(st.params.id), sm = a.summary, s = st.s;
      const TYPE = { main: ['Main idea', 'good'], detail: ['Minor detail', 'amber'], not: ['Not mentioned', 'bad'], contra: ['Contradicts the article', 'bad'] };
      const slots = [0, 1, 2].map(k => { const i = s.sel[k]; const o = i != null ? sm.options[i] : null;
        const st2 = s.checked && o ? (o.ok ? 'right' : 'wrong') : '';
        return `<button class="sslot ${o ? 'filled' : ''} ${st2}" ${o && !s.checked ? `data-act="sunpick" data-i="${i}"` : ''}>${o ? `<span class="bul">•</span><span>${esc(o.t)}</span>${!s.checked ? '<span class="x">×</span>' : ''}` : `<span class="meta">Tap a statement below to add it here</span>`}</button>`; }).join('');
      const list = s.order.filter(i => s.checked || !s.sel.includes(i)).map(i => { const o = sm.options[i], on = s.sel.includes(i), t = TYPE[o.type] || ['', ''];
        if (!s.checked) return `<button class="stmt2" data-act="spick" data-i="${i}"><span>${esc(o.t)}</span><span class="add">＋</span></button>`;
        return `<div class="stmt2 done ${o.ok ? 'r' : on ? 'w' : ''}"><div class="row" style="gap:6px"><span class="tchip ${t[1]}">${t[0]}</span>${on ? '<span class="you">you chose this</span>' : ''}</div><span>${esc(o.t)}</span>
          <div class="spread"><span class="meta">${esc(o.why)}</span>${o.para ? `<button class="link" data-act="sev" data-i="${i}">Show in article ›</button>` : ''}</div></div>`; }).join('');
      let sheet = '';
      if (s.sheet >= 0) { const o = sm.options[s.sheet], p = esc(a.paras[o.para - 1]), e = esc(o.evidence || '');
        sheet = `<div class="sheet-bg" data-act="sclose"></div><div class="sheet" style="--bc:var(--hl);--bt:var(--hlbg)"><div class="grab"></div>
          <div class="spread"><span class="kind">${(TYPE[o.type] || [''])[0]}</span><span class="chip">Paragraph ${o.para}</span></div>
          <p class="sheetp">${e && p.includes(e) ? p.replace(e, `<mark>${e}</mark>`) : p}</p><button class="ghost" data-act="sclose">Close</button></div>`; }
      const words = (s.own.trim().match(/[A-Za-z’'-]+/g) || []).length;
      const modelHtml = esc(sm.model).replace(/\b(but|because|so|then|also|first|after that|however)\b/gi, '<b class="tw">$1</b>');
      const CHECK = ['I wrote the main idea, not small details.', 'I used my own words, not whole sentences from the story.', 'I joined ideas with but, because or so.', 'My summary is 30 words or fewer.'];
      return `<div class="wrap">
        <div><div class="eyebrow">Step 6 · Summary</div><div class="h2">Main ideas</div>
          <div class="meta">Choose the THREE sentences that tell the most important ideas of the story. The others are small details, are not in the story, or say something wrong.</div></div>
        <div class="panel sumbox"><div class="intro-s">${esc(sm.intro)}</div><div class="slots3">${slots}</div>
          ${s.checked ? `<div class="spread"><span class="h3">Score</span><span class="h2 num">${s.pts} / 2</span></div><div class="meta">Scoring: 3 correct = 2 points, 2 correct = 1 point, fewer = 0.</div>` : `<button class="btn ${s.sel.length < 3 ? 'dim' : ''}" data-act="scheck" ${s.sel.length < 3 ? 'disabled' : ''}>Check · ${s.sel.length}/3</button>`}</div>
        ${s.checked ? `<div class="eyebrow">All six statements</div>` : `<div class="eyebrow">Statements</div>`}
        <div class="stmts">${list}</div>
        ${s.checked ? `<div class="panel">
          <span class="eyebrow">Part 2 · Say it in your own words</span>
          <div class="h3">Write 1–2 sentences about the whole story (30 words or fewer).</div>
          <textarea class="ta short" id="sumIn" placeholder="In your own words…" ${s.compared ? 'readonly' : ''}>${esc(s.own)}</textarea>
          <div class="spread"><span class="meta num" id="swc" style="${words > 40 ? 'color:var(--bad)' : words >= 15 ? 'color:var(--good)' : ''}">${words} / 40 words</span><span class="meta">or record it out loud</span></div>
          ${recorder(`${a.id}-sumrec`)}
          ${!s.compared ? `<button class="btn" data-act="scompare">Compare with the model</button>` : `
            <div class="model"><span class="eyebrow">Model summary</span><p>${modelHtml}</p><span class="meta">Transition words are in bold.</span></div>
            <span class="eyebrow">Check your own summary</span>
            ${CHECK.map((c, i) => `<button class="chk ${s.checks[i] ? 'on' : ''}" data-act="schk" data-i="${i}"><span class="cb">${s.checks[i] ? '✓' : ''}</span><span>${c}</span></button>`).join('')}
            <div class="row"><button class="ghost" data-act="sedit">Edit my summary</button><button class="btn" data-act="sdone">Done</button></div>`}
        </div>

      if (s.checked) return;
      const k = +b.dataset.k, slot = s.branches.flatMap(x => x.slots).find(x => x.k === k);
      if (slot.fill) { const p = s.pool.find(x => x.t === slot.fill && x.used); if (p) p.used = false; slot.fill = ''; }
      s.sel = k; break;
    }
    case 'chip': {
      if (s.checked) return;
      const p = s.pool[+b.dataset.i]; if (p.used || s.sel < 0) return;
      const slots = s.branches.flatMap(x => x.slots), slot = slots.find(x => x.k === s.sel);
      if (slot.fill) { const old = s.pool.find(x => x.t === slot.fill && x.used); if (old) old.used = false; }
      slot.fill = p.t; p.used = true;
      const nx = slots.find(x => !x.fill); s.sel = nx ? nx.k : -1; break;
    }
    case 'mmcheck': {
      const slots = s.branches.flatMap(x => x.slots);
      if (slots.some(x => !x.fill)) return toast('Fill every box first');
      let r = 0; slots.forEach(y => { const ok = y.fill === y.answer; if (ok) r++; y.state = ok ? 'right' : 'wrong'; });
      s.checked = true; s.score = `${r}/${slots.length}`; s.sel = -1; markDone(id, 'mindmap', { mindmap: { c: r, t: slots.length } }); break;
    }
    case 'mmopen': s.sheet = +b.dataset.b; break;
    case 'mmclose': s.sheet = -1; break;
    case 'mmshow': s.branches.forEach(x => x.slots.forEach(y => { if (y.state !== 'right') { y.fill = y.answer; y.state = 'fixed'; } })); break;
    case 'mmretry': PAGES.mindmap.init(st); break;
    case 'rec': {
      const key = b.dataset.key;
      if (recLive && recLive.key === key) { P.rec[key] = { sec: Math.max(1, Math.round((Date.now() - recLive.t) / 1000)), at: nowLabel() }; recLive = null; if (key.endsWith('-speak')) markDone(id, 'speak'); toast('Saved (simulated in preview)'); }
      else if (recLive) return toast('Stop the other recording first');
      else { recLive = { key, t: Date.now() }; toast('Recording… (simulated)'); }
      break;
    }
    case 'recplay': return toast('Plays your recording in WeChat');
    case 'recshare': return toast('Opens a WeChat chat to send the file');
    case 'wrsubmit': {
      const a = art(id), text = $('#wrIn').value || '', n = wc(text);
      if (n < a.write.minWords) return toast(`Write at least ${a.write.minWords} words`);
      P.writing[id] = { text, at: nowLabel() }; markDone(id, 'write', { writingWords: n }); toast('Saved'); break;
    }
    case 'wrcopy': { const a = art(id); return copy([`[Daily News Writing] ${P.name || '(no name)'} · ${a.date} ${a.title}`, '', $('#wrIn').value || ''].join('\n')); }
    case 'retake': return go('quiz', { mode: b.dataset.mode, id });
    case 'rescopy': { const a = art(id), r = arec(id); return copy([`[Daily Reading A2] ${P.name || '(no name)'}`, `Story: ${a.date} ${a.title}`, `Time: ${r.at}`, ...s.tips].join('\n')); }
    default: return;
  }
  render(top);
});
document.addEventListener('submit', e => {
  if (!e.target.matches('[data-act=spell]')) return;
  e.preventDefault();
  const st = cur(), s = st.s; if (s.answered) return;
  const v = ($('#spellIn').value || '').trim().toLowerCase(); if (!v) return;
  s.typed = v; const norm = x => x.toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').replace(/[.!?]$/, '').trim(); answer(st, s.qs[s.i].answer.split(' / ').some(x => norm(x) === norm(v)), -1); render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameIn') { P.name = e.target.value.trim(); save(); }
  if (e.target.id === 'sumIn') { const st = cur(); st.s.own = e.target.value; const n = (st.s.own.trim().match(/[A-Za-z’'-]+/g) || []).length; const el = $('#swc'); el.textContent = `${n} / 40 words`; el.style.color = n > 40 ? 'var(--bad)' : n >= 15 ? 'var(--good)' : ''; }
  if (e.target.id === 'wrIn') {
    const a = art(cur().params.id), text = e.target.value, n = wc(text);
    P.writing[a.id] = Object.assign(P.writing[a.id] || {}, { text }); save();
    const el = $('#wc'); el.textContent = `${n} / ${a.write.minWords}+ words`; el.style.color = n >= a.write.minWords ? 'var(--good)' : '';
  }
});
async function boot() {
  $('#body').innerHTML = '<div class="wrap"><div class="panel"><div class="h3">Loading today\'s stories…</div><div class="bar"><div class="fill" style="width:40%"></div></div></div></div>';
  try {
    const idx = await (await fetch('days/index.json', { cache: 'no-store' })).json();
    const list = (idx.days || []).slice().sort().reverse().slice(0, 21);
    const days = await Promise.all(list.map(d => fetch(`days/${d}.json`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)));
    DAYS = days.filter(d => d && d.articles && d.articles.length);
    DAYS.forEach(d => Object.assign(AUDIO, d.audio || {}));
  } catch (e) { DAYS = []; }
  if (!DAYS.length) { $('#body').innerHTML = '<div class="wrap"><div class="panel"><div class="h3">No stories yet</div><div class="meta">Today\'s stories have not been published. Check back after 9:30 a.m.</div></div></div>'; return; }
  go('home');
}
boot();

</script>
